name: PR Documentation Check

on:
  pull_request:
    paths:
      - 'workspaces/*/plugins/*/**'
      - 'workspaces/*/packages/*/**'

permissions:
  pull-requests: write
  contents: read

jobs:
  check-documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@63c24ba6bd7ba022e95695ff85de572c04a18142 # v2.7.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@1d96c772d19495a3b5c517cd2bc0cb401ea0529f # v4

      - name: Check README documentation
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');

            // Get changed files
            const baseSha = '${{ github.event.pull_request.base.sha }}';
            const headSha = '${{ github.event.pull_request.head.sha }}';
            const changedFiles = execSync(`git diff --name-only ${baseSha}...${headSha}`)
              .toString()
              .split('\n')
              .filter(f => f.trim() !== '');

            // Find plugin package.json files
            const pluginPaths = new Set();
            for (const file of changedFiles) {
              const match = file.match(/^workspaces\/([^/]+)\/plugins\/([^/]+)\//);
              if (match) {
                const workspace = match[1];
                const plugin = match[2];
                const pluginPath = path.join('workspaces', workspace, 'plugins', plugin);
                pluginPaths.add(pluginPath);
              }
            }

            if (pluginPaths.size === 0) {
              console.log('No plugin changes detected');
              return;
            }

            // Check README for each plugin
            const issues = [];
            for (const pluginPath of pluginPaths) {
              const readmePath = path.join(pluginPath, 'README.md');
              
              if (!fs.existsSync(readmePath)) {
                issues.push({
                  plugin: path.basename(pluginPath),
                  path: pluginPath,
                  missing: ['README.md file']
                });
                continue;
              }

              const readmeContent = fs.readFileSync(readmePath, 'utf8');
              const missingSections = [];

              // Check for required sections
              if (!/##\s+(Installation|Installing|Getting Started)/i.test(readmeContent)) {
                missingSections.push('Installation section');
              }
              if (!/##\s+(Configuration|Setup|Config)/i.test(readmeContent)) {
                missingSections.push('Configuration section');
              }
              if (!/##\s+(Usage|How to|Examples)/i.test(readmeContent)) {
                missingSections.push('Usage section');
              }

              if (missingSections.length > 0) {
                issues.push({
                  plugin: path.basename(pluginPath),
                  path: pluginPath,
                  missing: missingSections
                });
              }
            }

            if (issues.length === 0) {
              console.log('All plugin documentation looks good!');
              return;
            }

            // Build comment
            const marker = '<!-- documentation-check -->';
            let comment = `${marker}
## 📝 Documentation Check

The following plugins are missing recommended documentation sections:\n\n`;

            for (const issue of issues) {
              comment += `### Plugin: \`${issue.plugin}\`\n\n`;
              comment += `**Path:** \`${issue.path}\`\n\n`;
              comment += 'Missing sections:\n';
              for (const missing of issue.missing) {
                comment += `- [ ] ${missing}\n`;
              }
              comment += '\n';
            }

            comment += `**Tip:** See existing plugin READMEs for recommended structure, or check [CONTRIBUTING.md](https://github.com/backstage/community-plugins/blob/main/CONTRIBUTING.md) for guidelines.`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.body && comment.body.includes(marker)
            );

            // Update or create comment
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
